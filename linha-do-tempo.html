<style>
/* ===== estrutura (identidade do site) ===== */
.lt-wrap{max-width:1240px;margin:0 auto;padding:22px 22px 40px}
.lt-top small{display:block;font:800 11px Inter,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand)}
.lt-top h1{font:800 clamp(34px,5vw,56px)/1 "Baloo 2",Inter,sans-serif;margin:4px 0 4px;color:var(--txt);letter-spacing:-.5px}
.lt-top p{color:var(--mut);margin:0 0 16px;font-size:15px}
/* seletor de anos: régua com pontos, na identidade do site */
.lt-rail{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:6px;padding:10px 8px 6px;border-radius:20px;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 10px 30px var(--glow)}
.rl-arr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--sunk);color:var(--brand);font-size:20px;line-height:1;cursor:pointer;transition:background .15s,transform .15s}
.rl-arr:hover{background:var(--brand-soft);transform:scale(1.06)}
.rl-arr[disabled]{opacity:.3;cursor:default;transform:none}
.lt-yrs{display:flex;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none;padding:4px 0 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.lt-yrs::-webkit-scrollbar{display:none}
.ry{position:relative;flex:0 0 74px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;border:0;background:none;cursor:pointer;color:var(--mut);font:700 15px "Rajdhani",Inter,sans-serif;scroll-snap-align:center}
.ry:before{content:"";position:absolute;left:0;right:0;top:44px;height:4px;background:color-mix(in srgb,var(--c) 35%,var(--line2))}
.ry:first-child:before{left:50%;border-radius:3px 0 0 3px}.ry:last-child:before{right:50%}
.ry .rl{position:relative;z-index:1;white-space:nowrap;padding:3px 9px;border-radius:999px;transition:all .2s}
.ry .dt{position:absolute;top:38px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--panel);border:3px solid color-mix(in srgb,var(--c) 70%,var(--line2));z-index:1;transition:all .2s}
.ry small{position:absolute;top:60px;left:0;right:0;font:600 10.5px Inter,sans-serif;color:var(--faint);opacity:0;transition:opacity .2s}
.ry:hover{color:var(--txt)}.ry:hover .dt{transform:scale(1.2);border-color:var(--c)}.ry:hover small{opacity:1}
.ry.on{color:#fff}
.ry.on .rl{background:#0a6a9a;box-shadow:0 6px 16px var(--glow);font-size:17px;padding:4px 12px}
.ry.on .dt{width:22px;height:22px;margin-left:-11px;top:35px;background:#0a6a9a;border:4px solid var(--panel);box-shadow:0 0 0 3px #0a6a9a,0 0 18px var(--glow)}
.ry.on small{opacity:1;color:#0a6a9a;font-weight:800}
:root[data-theme="dark"] .ry.on small{color:#7fd3ff}
.ry.era0 .ert{position:absolute;top:-2px}
@media(max-width:760px){.lt-rail{grid-template-columns:30px minmax(0,1fr) 30px;padding:8px 4px 4px;border-radius:16px}.rl-arr{width:30px;height:30px;font-size:17px}.ry{flex-basis:64px;height:84px;font-size:14px}.ry small{top:62px}.lt-yrs{scroll-snap-type:x proximity}}
/* ===== palco do ano (muda de época) ===== */
.lt-stage{position:relative;margin-top:8px;border-radius:22px;overflow:hidden;transition:background .4s}
.lt-hero{position:relative;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:14px;padding:30px 24px 26px;text-align:center}
.lt-hero .nav{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:22px;line-height:1}
.lt-hero .nav[disabled]{opacity:.25;cursor:default}
.lt-era{font:800 11px Inter,sans-serif;letter-spacing:1.6px;text-transform:uppercase}
.lt-big{font-size:clamp(64px,12vw,128px);line-height:.95;margin:6px 0 6px}
.lt-lema{font-weight:700;font-size:17px}
.lt-sub{font-size:14px;opacity:.85;max-width:62ch;margin:6px auto 0}
.lt-deco{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:6px 12px;border-radius:999px}
.lt-body{padding:6px 24px 30px}
.lt-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
.lt-chips button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font:600 12.5px Inter,sans-serif;cursor:pointer;border:1px solid transparent}
.lt-chips button .ico{width:14px;height:14px}
.lt-chips button small{opacity:.7}
.lt-list{position:relative;padding-left:30px}
.lt-list:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px}
.lt-mes{position:relative;margin:4px 0 12px;font:800 18px "Baloo 2",Inter,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.lt-mes:before{content:"";position:absolute;left:-28px;top:6px;width:13px;height:13px;border-radius:50%;border:3px solid currentColor;background:var(--lt-bg,#fff)}
.lt-it{position:relative;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center;padding:12px;margin:0 0 14px;border-radius:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;opacity:0;transform:translateY(12px)}
.lt-ab{all:unset;cursor:pointer;color:inherit;font:inherit}
.lt-ab::after{content:"";position:absolute;inset:0;border-radius:inherit}
.lt-it:focus-within{outline:3px solid #ffbf00;outline-offset:3px}
.lt-ab:focus-visible{text-decoration:underline}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lt-marcas{margin:14px 4px 0;font-size:11.5px;color:var(--mut);text-align:center}
.lt-th .cdo-t,.lt-th .yb,.lt-th .pl{pointer-events:none}
.lt-it.in{opacity:1;transform:none;transition:opacity .45s ease,transform .45s ease,box-shadow .15s}
.lt-it:hover{transform:translateY(-2px)}
.lt-th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0003}
.lt-th img{width:100%;height:100%;object-fit:cover;display:block}
.lt-th .yb{position:absolute;left:8px;top:8px;z-index:4;font:700 11px Inter,sans-serif;padding:3px 7px;border-radius:6px;background:#000a;color:#fff}
.lt-th .pl{position:absolute;right:10px;bottom:10px;z-index:4;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#000a;color:#fff;font-size:13px}
.lt-d{font:600 12.5px Inter,sans-serif;margin-bottom:4px}
.lt-it h3{margin:0 0 6px;font-size:20px;line-height:1.15}
.lt-it p{margin:0 0 10px;font-size:14px;line-height:1.45;opacity:.85}
.lt-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;opacity:.85}
.lt-cat{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600}
.lt-cat .ico{width:13px;height:13px}
.lt-foot{font-size:11.5px;opacity:.75;margin-top:8px}
.lt-vazio{padding:30px;text-align:center;opacity:.8}
.lt-mais{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.lt-mais button{padding:11px 18px;border-radius:12px;font:700 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent}
.lt-tick{display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:12px}
.lt-tick b{flex:none;position:relative;z-index:1;padding:6px 12px;font:800 10.5px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;background:inherit;box-shadow:6px 0 10px -4px #0003}
.lt-tick .tk{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.lt-tick .tk span{display:inline-flex;gap:18px;padding:6px 0 6px 24px;animation:tick 90s linear infinite}
.lt-tick:hover .tk span{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.lt-tick i{font-style:normal}
@media(prefers-reduced-motion:reduce){.lt-tick .tk span{animation:none}.lt-it{opacity:1;transform:none;transition:none}.lt-yrs{scroll-behavior:auto}.lt-it:hover,.ry:hover .dt,.rl-arr:hover{transform:none}}
@media(max-width:760px){
  .lt-wrap{padding:14px 12px 30px}
  .lt-hero{grid-template-columns:40px 1fr 40px;padding:22px 10px 20px;gap:6px}.lt-hero .nav{width:38px;height:38px}
  .lt-body{padding:4px 12px 22px}
  .lt-it{grid-template-columns:1fr;gap:10px;padding:10px}
  .lt-it h3{font-size:18px}
  .lt-list{padding-left:22px}.lt-mes:before{left:-21px}.lt-list:before{left:4px}

}

<script>

setSubOn("tl");renderWallet();
const $=id=>document.getElementById(id);
const yKey=y=>{y=parseInt(y)||2020;return y<2000?"1995–1999":y<=2003?"2000–2003":y>=2026?"2026":String(y)};
const temAno=k=>typeof k==="string"&&Object.hasOwn(YEAR_INFO,k); // "#constructor" e afins não são anos
const yLab=k=>(temAno(k)&&YEAR_INFO[k].rot)||k;
const KEYS=Object.keys(YEAR_INFO).sort((a,b)=>parseInt(a)-parseInt(b));
const CAT_IC={"Vídeos":"video","TV":"tv","Música":"music","Cultura":"culture","Zoeira":"star","Fotos":"photo"};
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
// época visual de cada ano (só nesta página)
const EPOCA=k=>{const y=parseInt(k);return y<2000?"95":y<2004?"xp":y<2007?"ork":y<2010?"msn":y<2013?"fb":y<2017?"zap":y<2020?"ig":"tt"};
const EPOCA_NOME={"95":"Era da internet discada","xp":"Era do Kazaa e do ICQ","ork":"Era do Orkut","msn":"Era do MSN","fb":"Era do Facebook","zap":"Era do Zap","ig":"Era dos Stories","tt":"Era do vídeo curto"};
const EPOCA_ANOS={"95":"1995–1999","xp":"2000–2003","ork":"2004–2006","msn":"2007–2009","fb":"2010–2012","zap":"2013–2016","ig":"2017–2019","tt":"2020–2026"};
// detalhe de cada ano (faixinha e notícia correndo)
const DETALHE={
 "1995–1999":["👁 Você é o visitante nº 000.031.415","Bem-vindo à minha home page!!! · Melhor visualizado em 800x600 · Página em construção 🚧 · Assine meu livro de visitas"],
 "2000–2003":["⬇ baixando musica_nova.mp3 · 2 dias restantes","ICQ: uh-oh! · Kazaa · Winamp: it really whips · Discador da internet grátis conectado a 56 Kbps"],
 "2004":["💜 Você tem 3 scraps novos","O Orkut chegou · Comunidade “Eu odeio acordar cedo” · Fulano quer ser seu amigo"],
 "2005":["▶ Nasce o YouTube","Lan house lotada · Joseph Climber no e-mail · MSN Messenger 7.0"],
 "2006":["📼 Vídeos caseiros","Tapa na Pantera · Sanduíche-íche · Cansei de ser sexy"],
 "2007":["🦋 Fernandinha acabou de entrar","Deixem a Britney em paz! · Tropa de Elite pirata · Nick com ~*~ estrelinhas"],
 "2008":["✨ Windows Vista com vidro","Funk do Créu · Caetano: como você é burro · Orkut com tema rosa"],
 "2009":["🐦 Trending topics","Stefhany do Crossfox · Twitter chega forte · Iaririarai, dorgas mano"],
 "2010":["📯 Vuuuuuuuuuu","Copa da África · Cala Boca Galvão · Restart e Avassaladores"],
 "2011":["👍 Curtir","Ai se eu te pego · Mamilos polêmicos · Facebook passa a bombar"],
 "2012":["⏳ Contagem para o fim do mundo: 21/12/2012","Para Nossa Alegria · Grávida de Taubaté · Gina Indelicada · Fim do mundo?"],
 "2013":["✔✔ visualizado","Junho de 2013 · Rei do Camarote · Ave Maria, doido!"],
 "2014":["⚽ Brasil 1 x 7 Alemanha","Copa no Brasil · Taca-le pau, Marcos! · Eita, Giovana!"],
 "2015":["👗 Azul e preto ou branco e dourado?","Já acabou, Jéssica? · Cacete de agulha · Sextou"],
 "2016":["⚡ Um Pikachu selvagem apareceu","Pokémon Go · Tá tranquilo, tá favorável · Nazaré confusa"],
 "2017":["⭕ Stories","Que tiro foi esse? · Alisa meu pelo · Fidget spinner"],
 "2018":["🐤 Canarinho Pistola","Copa da Rússia · TikTok chega · Cachorro dançando forró"],
 "2019":["🎧 Áudio de 2 minutos","Panificadora Alfa · Joelma triste e feliz · Galo cego"],
 "2020":["🏠 #FiqueEmCasa","Live do Bruno e Marrone · Vira-lata caramelo na nota de 200 · Uma sopa pá nóis"],
 "2021":["🧩 figurinha nova no grupo","Pior que é · Um gnomo estava andando · Tô cagado de fome"],
 "2022":["🦈 Tubarão te amo","Salada da Dona Eleni · Leandro, o cachorro · Copa no Catar"],
 "2023":["🔵 indo ali","Não gostei, amei · Ô Denise, sai da live · Ai, Zé da Manga"],
 "2024":["🌭 Calma, Calabreso!","Que show da Xuxa é esse? · Luva de horror cósmico"],
 "2025":["🤖 feito por IA","Marisa Maiô · Morango do amor · Passinho do Jamal"],
 "2026":["4️⃣2️⃣ 67 ou 42?","Gabi Panquequinha · Tu, finish! · Copa do Mundo"]
};
const ST={ano:"2012",cat:"Todas"};
const calmo=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const rolar=()=>calmo()?"auto":"smooth";
const ALL=MEMES.slice();
const doAno=k=>ALL.filter(m=>yKey(m.y)===k);
const foto=m=>m.img?m.img:m.yt?`https://i.ytimg.com/vi/${m.yt}/mqdefault.jpg`:"";
const dataTxt=m=>{const d=m.date?new Date(m.date+"T12:00:00"):null;if(!d||isNaN(d))return String(m.y);return d.getDate()===1?`${MES[d.getMonth()][0].toUpperCase()+MES[d.getMonth()].slice(1)} de ${d.getFullYear()}`:`${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}`};
const rodape={"95":()=>"🔗 Adicionar aos Favoritos · Assinar livro de visitas","xp":()=>"📎 FW: FW: olha isso kkkk","ork":m=>`💬 ${1+m.id.length%9} scraps · ⭐ fã`,"msn":()=>"🦋 compartilhar no MSN","fb":()=>"Curtir · Comentar · Compartilhar","zap":m=>`${String(8+m.id.length%12).padStart(2,"0")}:${String(m.id.length*7%60).padStart(2,"0")} ✔✔`,"ig":m=>`♥ ${fmt(m.saves||100)} curtidas`,"tt":m=>`♥ ${short(Math.round((m.views||1000)/3))} · 💬 ${short(m.saves||100)} · ↗ compartilhar`};

const COR={"95":"#00a3a3","xp":"#2a6bff","ork":"#e3007a","msn":"#4caf2a","fb":"#3b5998","zap":"#25d366","ig":"#dc2743","tt":"#fe2c55"};
function anos(){
  $("yrs").innerHTML=KEYS.map(k=>{const n=doAno(k).length;return`<button class="ry ${k===ST.ano?"on":""}" data-k="${escapeHtml(k)}" style="--c:${COR[EPOCA(k)]}" title="${escapeHtml(yLab(k))} · ${n} meme${n===1?"":"s"}" ${k===ST.ano?'aria-current="true"':""}><span class="rl">${escapeHtml(yLab(k))}</span><i class="dt"></i><small>${n} meme${n===1?"":"s"}</small></button>`}).join("");
  $("yrs").querySelectorAll("button").forEach(b=>b.onclick=()=>ir(b.dataset.k,()=>$("yrs").querySelector(".ry.on")));
  const i=KEYS.indexOf(ST.ano);$("yl").disabled=!KEYS[i-1];$("yr").disabled=!KEYS[i+1];
  const on=$("yrs").querySelector(".on"),nv=$("yrs");if(on){const d=on.getBoundingClientRect().left-nv.getBoundingClientRect().left;nv.scrollTo({left:nv.scrollLeft+d-nv.clientWidth/2+on.clientWidth/2,behavior:rolar()})}
}
function palco(){
  const k=ST.ano,i=KEYS.indexOf(k),p=KEYS[i-1],n=KEYS[i+1],e=EPOCA(k),info=temAno(k)?YEAR_INFO[k]:{lema:"",txt:""},det=Object.hasOwn(DETALHE,k)?DETALHE[k]:["",""];
  const L=doAno(k).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const cats=["Todas",...new Set(L.map(m=>m.c))];if(!cats.includes(ST.cat))ST.cat="Todas";
  const F=L.filter(m=>ST.cat==="Todas"||m.c===ST.cat);
  const grupos=[];F.forEach(m=>{const d=m.date?new Date(m.date+"T12:00:00"):null;const g=d&&!isNaN(d)?(k.includes("–")?`${MES[d.getMonth()]} de ${d.getFullYear()}`:MES[d.getMonth()]):String(m.y);let x=grupos.find(z=>z.g===g);if(!x)grupos.push(x={g,its:[]});x.its.push(m)});
  const st=$("stage");st.className="lt-stage th-"+e;document.body.className=document.body.className.replace(/\bep-\w+/g,"").trim()+" ep-"+e;
  const nt=det[1].split(" · ").map(x=>`<i>${escapeHtml(x)}</i>`).join("<i>·</i>");
  st.innerHTML=`<div class="lt-tick" aria-hidden="true"><b>${k.includes("–")?"Na época":"Em "+escapeHtml(k)}</b><div class="tk"><span>${Array(8).fill(nt+"<i>·</i>").join("")}</span></div></div>
   <div class="lt-hero"><button class="nav" ${p?`data-k="${escapeHtml(p)}" data-f="prev"`:"disabled"} aria-label="Ano anterior">‹</button>
     <div><div class="lt-era">${EPOCA_NOME[e]} · ${EPOCA_ANOS[e]}</div><div class="lt-big">${escapeHtml(yLab(k))}</div><div class="lt-lema">${escapeHtml(info.lema)}</div>
      <p class="lt-sub">${L.length} ${L.length===1?"viral salvo":"virais salvos"} · ${escapeHtml(info.txt)}</p>${det[0]?`<span class="lt-deco">${escapeHtml(det[0])}</span>`:""}</div>
     <button class="nav" ${n?`data-k="${escapeHtml(n)}" data-f="next"`:"disabled"} aria-label="Próximo ano">›</button></div>
   <div class="lt-body"><div class="lt-chips">${cats.map(c=>`<button class="${c===ST.cat?"on":""}" data-c="${escapeHtml(c)}">${c==="Todas"?`Tudo de ${escapeHtml(yLab(k))}`:icon(CAT_IC[c]||"video")+escapeHtml(c)} <small>${c==="Todas"?L.length:L.filter(m=>m.c===c).length}</small></button>`).join("")}</div>
    <div class="lt-list">${grupos.length?grupos.map(g=>`<div class="lt-mes"><span>${escapeHtml(g.g)}</span></div>${g.its.map(m=>`<article class="lt-it">
       <div class="lt-th${m.vert?" vert":""}">${m.cuidado?`<span class="cdo-t">${icon("care","in")}<b>Selo de cuidado</b><small>clique para saber mais</small></span>`:""}${foto(m)?`<img src="${escapeHtml(foto(m))}" alt="" loading="lazy"${m.cuidado?' class="cdo-blur"':""}>`:""}<span class="yb">${m.y}</span>${m.yt&&m.tipo!=="foto"?`<span class="pl" aria-hidden="true">▶</span>`:""}</div>
       <div class="lt-tx"><div class="lt-d">${escapeHtml(dataTxt(m))}</div><h3><button class="lt-ab" data-id="${escapeHtml(m.id)}">${escapeHtml(m.t)}</button></h3><p>${escapeHtml(m.d||"")}</p>
        <span class="lt-meta"><span class="lt-cat">${icon(CAT_IC[m.c]||"video")}${escapeHtml(m.c)}</span>${m.by?`<span>por ${escapeHtml(m.by)}</span>`:""}${m.tipo==="foto"?"<span>📷 foto</span>":m.vert?"<span>📱 vídeo vertical</span>":""}</span>
        <div class="lt-foot">${rodape[e](m)}</div></div></article>`).join("")}`).join(""):`<div class="lt-vazio">Nada desse tipo em ${escapeHtml(yLab(k))} ainda. <a href="index.html#send">Envie um meme</a>!</div>`}</div>
    <div class="lt-mais">${p?`<button data-k="${escapeHtml(p)}" data-f="mprev">‹ ${escapeHtml(yLab(p))}</button>`:"<span></span>"}${n?`<button data-k="${escapeHtml(n)}" data-f="mnext">${escapeHtml(yLab(n))} ›</button>`:"<span></span>"}</div></div>`;
  st.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;ir(b.dataset.k,()=>st.querySelector(`[data-f="${f}"]:not([disabled])`)||st.querySelector(".nav:not([disabled])"));if(f&&f.startsWith("m"))$("yrs").scrollIntoView({behavior:rolar(),block:"start"})});
  st.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ST.cat=b.dataset.c;palco();const c=ST.cat;const nb=[...st.querySelectorAll("[data-c]")].find(x=>x.dataset.c===c);nb&&nb.focus();
    const n=doAno(ST.ano).filter(m=>c==="Todas"||m.c===c).length;avisar(`${c==="Todas"?"Tudo de "+yLab(ST.ano):c+" em "+yLab(ST.ano)}: ${n} ${n===1?"viral":"virais"}`)});
  st.querySelectorAll(".lt-ab").forEach(b=>b.onclick=ev=>{ev.stopPropagation();ver(b.dataset.id)});
  st.querySelectorAll(".lt-it").forEach(a=>a.onclick=ev=>{if(ev.target.closest("a,button"))return;a.querySelector(".lt-ab").click()});
  // os memes entram com animação conforme aparecem na tela
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{rootMargin:"0px 0px -40px"});
  st.querySelectorAll(".lt-it").forEach((it,j)=>{it.style.transitionDelay=Math.min(j,6)*60+"ms";io.observe(it)});
  document.title=`${yLab(k)} · Linha do tempo · NÃO SALVO`;
}
function avisar(t){const a=$("aviso");a.textContent="";setTimeout(()=>a.textContent=t,30)}
function ir(k,foco){if(!temAno(k))return;const veioDaRegua=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#yrs,.lt-rail");
  ST.ano=k;ST.cat="Todas";history.replaceState(null,"","#"+encodeURIComponent(k));anos();palco();
  const n=doAno(k).length;avisar(`Ano ${yLab(k)}, ${n} ${n===1?"viral":"virais"}`);
  // devolve o foco ao botão equivalente (a régua e o palco foram refeitos)
  const alvo=typeof foco==="function"?foco():veioDaRegua?($("yrs").querySelector(".ry.on")):null;if(alvo)alvo.focus({preventScroll:true})}
function ver(id){const m=ALL.find(x=>x.id===id);if(!m)return;const rel=ALL.filter(x=>x.id!==id).sort((p,q)=>Math.abs(p.y-m.y)-Math.abs(q.y-m.y));
  openViewer(m,{related:rel,onPick:ver,onYear:y=>ir(yKey(y))})}
$("yl").onclick=()=>{const i=KEYS.indexOf(ST.ano);if(KEYS[i-1])ir(KEYS[i-1],()=>$("yl").disabled?$("yr"):$("yl"))};$("yr").onclick=()=>{const i=KEYS.indexOf(ST.ano);if(KEYS[i+1])ir(KEYS[i+1],()=>$("yr").disabled?$("yl"):$("yr"))};
addEventListener("keydown",e=>{if(document.querySelector(".vw"))return;const i=KEYS.indexOf(ST.ano);if(e.key==="ArrowRight"&&KEYS[i+1])ir(KEYS[i+1]);if(e.key==="ArrowLeft"&&KEYS[i-1])ir(KEYS[i-1])});
addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));const k=temAno(h)?h:/^\d{4}$/.test(h)?yKey(h):null;if(k&&k!==ST.ano)ir(k)});
const h0=decodeURIComponent(location.hash.slice(1));ST.ano=temAno(h0)?h0:/^\d{4}$/.test(h0)?yKey(h0):"2012";
anos();palco();
</script>
