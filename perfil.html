<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="gate.js?v=20261120c"></script>
<script src="cliente-economia.js?v=20261121p"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · NÃO SALVO</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261121p">
<link rel="stylesheet" href="viewer.css?v=20261120d">
<link rel="stylesheet" href="perfil.css?v=20261121p">
<script>try{var t=localStorage.getItem("ns_theme")}catch(e){}document.documentElement.dataset.theme=t==="dark"?"dark":"light"</script>
</head>
<body>
<main class="pf-wrap">
  <div id="barra"></div>
  <section id="pf" aria-live="polite"><p class="pf-st" role="status">Carregando o perfil…</p></section>
  <p id="aviso" class="sr-only" aria-live="polite"></p>
</main>

<dialog class="pf-dlg" id="dlg" aria-labelledby="dlgT">
  <form method="dialog" id="dlgF">
    <h2 id="dlgT">Editar o meu perfil</h2>
    <p>Escolha a rede da sua época e a carta que vai ficar em destaque. A foto do perfil é o seu gatinho.</p>
    <fieldset><legend>Visual do perfil</legend><div class="pf-lays" id="lays"></div></fieldset>
    <fieldset><legend><label for="fav">Carta favorita</label></legend><select id="fav"></select></fieldset>
    <p class="erro" id="dlgErro" role="alert"></p>
    <div class="rod">
      <button type="button" class="pf-bt" id="btGato">Editar gatinho e apelido</button>
      <span style="display:flex;gap:8px"><button type="button" class="pf-bt" id="btCancelar">Cancelar</button><button type="submit" class="pf-bt pri" id="btSalvar">Salvar</button></span>
    </div>
  </form>
</dialog>

<script src="common.js?v=20261121p"></script>
<script src="data.js?v=20261119q"></script>
<script src="player.js?v=20261119n"></script>
<script src="viewer.js?v=20261120e"></script>
<script src="alertas.js?v=20261119n"></script>
<script>
renderHeader("perfil",{sub:[
  {k:"inicio",ic:"home",label:"Início",href:"index.html"},
  {k:"tl",ic:"timeline",label:"Linha do tempo",href:"linha-do-tempo.html"},
  {k:"wiki",ic:"book",label:"Memepédia",href:"memepedia.html"},
  {k:"album",ic:"album",label:"Álbum de figurinhas",href:"album.html"},
  {sp:1},
  {k:"send",ic:"send",label:"Enviar meme",cta:1,href:"index.html#send"}
]});
renderWallet();

// ---- visuais do perfil: nomes e textos de cada rede (a interação é sempre um recado; o nome muda) ----
const LAYOUTS={
  orkut:{nome:"Orkut",dica:"scraps e comunidades",cor:"linear-gradient(90deg,#c4006a,#bfd0ea)",recados:"Scraps",acao:"enviar scrap",ph:a=>`escreva um scrap para ${a}…`,vazio:"Ninguém deixou scrap ainda. Seja o primeiro!",ok:"Scrap enviado!"},
  fotolog:{nome:"Fotolog",dica:"livro de visitas",cor:"linear-gradient(90deg,#262626,#8cc63f)",recados:"livro de visitas",acao:"assinar",ph:()=>"assine o livro de visitas…",vazio:"Ninguém assinou o livro de visitas ainda.",ok:"Você assinou o livro de visitas!"},
  msn:{nome:"MSN",dica:"mensagens offline",cor:"linear-gradient(90deg,#1a6fc2,#4caf2a)",recados:"Mensagens offline",acao:"Enviar",ph:a=>`Digite uma mensagem para ${a}…`,vazio:"Nenhuma mensagem ainda. Mande um oi!",ok:"Mensagem enviada!"},
  twitter:{nome:"Twitter antigo",dica:"o do passarinho",cor:"linear-gradient(90deg,#33ccff,#c0deed)",recados:"Menções",acao:"Tweetar",ph:a=>`@${a} `,vazio:"Ninguém mencionou ainda.",ok:"Tweet enviado!"},
  facebook:{nome:"Facebook antigo",dica:"o mural azul",cor:"linear-gradient(90deg,#3b5998,#e9ebee)",recados:"Mural",acao:"Publicar",ph:a=>`Escreva algo para ${a}…`,vazio:"O mural está vazio. Escreva algo!",ok:"Publicado no mural!"}
};
const MAX=300;
const $=id=>document.getElementById(id);
const esc=v=>escapeHtml(String(v??""));
const RORD=["Mítico","Lendário","Relíquia","Raro","Relevante","Comum"];
let P=null,REC=[],ALVO="",MOSTRAR_TODAS=false;

const params=new URLSearchParams(location.search);
const pedido=(params.get("u")||"").trim();

function avisar(t){const a=$("aviso");a.textContent="";setTimeout(()=>a.textContent=t,30)}
// a foto do perfil é sempre o gatinho (se o gato não for válido, a inicial)
function gato(o,ap,cls){return gatoValido(o)?`<span class="${cls||"pf-gato"}" role="img" aria-label="Gatinho de ${esc(ap)}">${catSVG(o)}</span>`:`<span class="${cls||"pf-gato"} ini" aria-hidden="true">${esc(String(ap||"?").charAt(0).toUpperCase())}</span>`}
const linkPerfil=ap=>`perfil.html?u=${encodeURIComponent(ap)}`;
const dataBR=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleDateString("pt-BR")};
const quando=d=>{const x=new Date(d);if(isNaN(x))return"";const s=(Date.now()-x)/1000;if(s<60)return"agora";if(s<3600)return`há ${Math.floor(s/60)} min`;if(s<86400)return`há ${Math.floor(s/3600)} h`;return x.toLocaleDateString("pt-BR")};
function colecao(id){return (typeof COLLECTIONS!=="undefined"&&COLLECTIONS.find(c=>c.id===id))||null}
function carta(c,grande){
  const col=colecao(c.colecao_id),bg=col?col.bg:["#334","#112"],m=c.meme_id&&typeof MEMES!=="undefined"&&MEMES.find(x=>x.id===c.meme_id);
  const img=m&&m.yt?`<img src="https://i.ytimg.com/vi/${esc(m.yt)}/mqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  return `<div class="pf-carta ${grande?"grande ":""}${esc(c.raridade)}" style="--rc:var(--${esc(c.raridade)})" role="img" aria-label="Carta ${esc(c.nome)}, ${esc(c.raridade)}">
   <div class="tp"><span>${String(c.numero).padStart(3,"0")}</span><em>${esc(c.raridade)}</em></div>
   <div class="art" style="background:linear-gradient(150deg,${esc(bg[0])},${esc(bg[1])})">${img}<span>${esc(c.emoji||"⭐")}</span></div>
   <div class="nm">${esc(c.nome)}</div><div class="ft">${esc(col?col.n:c.colecao_id)}</div></div>`;
}
function favHTML(){return P.carta_favorita?carta(P.carta_favorita,true):`<div class="pf-semfav">${P.perfil.eh_meu?"Escolha a sua carta favorita em “Editar perfil”.":"Ainda sem carta favorita."}</div>`}
function patHTML(){
  const p=P.patente,cor=p&&/^#[0-9a-f]{3,8}$/i.test(p.cor||"")?p.cor:"#0a6a9a",prox=P.proxima_patente;
  const pct=prox?Math.max(4,Math.min(100,Math.round(P.xp/(P.xp+prox.faltam)*100))):100;
  return `<div style="--pc:${cor}">${p?`<span class="pf-pat">⬢ ${esc(p.nome)}</span>`:""}<div class="pf-xp" role="progressbar" aria-label="Nível" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   <div class="pf-cap">${fmt(P.xp)} XP${prox?` · faltam ${fmt(prox.faltam)} para ${esc(prox.nome)}`:" · patente máxima"}</div></div>`;
}
function colsHTML(){return `<div class="pf-cols">${P.album.colecoes.map(k=>{const c=colecao(k.id),pct=k.total?Math.round(k.tenho/k.total*100):0;
  return `<div class="pf-col" style="--cc:${esc(c?c.c:"#0a6a9a")}"><span class="ic" aria-hidden="true">${esc(c?c.ic:"📒")}</span><span><b>${esc(k.nome)}${k.completa?" ✔":""}</b><span class="br"><i style="width:${pct}%"></i></span></span><small>${k.tenho}/${k.total}</small></div>`}).join("")}</div>`}
function figsHTML(max){
  const l=P.album.cartas.slice().sort((a,b)=>RORD.indexOf(a.raridade)-RORD.indexOf(b.raridade)||String(a.id).localeCompare(String(b.id)));
  if(!l.length)return `<p class="pf-vazio">${P.perfil.eh_meu?"Você ainda não tem figurinhas. Abra um pacote no álbum!":"Ainda sem figurinhas."}</p>`;
  const n=MOSTRAR_TODAS?l.length:Math.min(max,l.length);
  return `<div class="pf-figs">${l.slice(0,n).map(c=>carta(c)).join("")}</div>${l.length>n?`<button type="button" class="pf-bt pf-mais" data-todas>Ver todas as ${l.length} figurinhas</button>`:""}`;
}
function recadosHTML(L){
  const ap=P.perfil.apelido,eu=P.perfil.eh_meu,tw=P.perfil.layout==="twitter";
  const form=eu?"":`<form class="pf-form" id="rcF" novalidate>${tw?`<label class="q" for="rcT">O que você quer dizer para @${esc(ap)}?</label>`:`<label class="sr-only" for="rcT">${esc(L.ph(ap))}</label>`}
    <textarea id="rcT" maxlength="${MAX}" placeholder="${esc(L.ph(ap))}" required></textarea>
    <div class="ln"><small id="rcN" aria-live="polite">${MAX} caracteres restantes</small><button type="submit" id="rcB">${esc(L.acao)}</button></div></form>`;
  const lista=REC.length?`<ul class="pf-rcs">${REC.map(r=>`<li class="pf-rc">${gato(r.autor.avatar_gato,r.autor.apelido,"pf-mini")}<div>
     <div class="qm"><a href="${linkPerfil(r.autor.apelido)}">${esc(r.autor.apelido)}</a><time datetime="${esc(r.em)}">${esc(quando(r.em))}</time>${r.pode_apagar?`<button type="button" class="ap" data-apagar="${esc(r.id)}" aria-label="Apagar recado de ${esc(r.autor.apelido)}">apagar</button>`:""}</div>
     <p>${tw?`<span class="ar">@${esc(ap)}</span> `:""}${esc(r.texto)}</p>${P.perfil.layout==="facebook"?`<div class="rod">Curtir · Comentar · ${esc(quando(r.em))}</div>`:""}</div></li>`).join("")}</ul>`:`<p class="pf-vazio">${esc(eu?"Quando alguém deixar um recado, ele aparece aqui.":L.vazio)}</p>`;
  return form+lista;
}

// ---- cada rede monta o perfil do seu jeito ----
function montar(){
  const p=P.perfil,L=LAYOUTS[p.layout]||LAYOUTS.orkut,ap=esc(p.apelido),desde=dataBR(p.membro_desde),nRec=REC.length;
  const a=P.album,figs=figsHTML(12),cols=colsHTML(),rec=recadosHTML(L),pat=patHTML(),fav=favHTML();
  const T={
    orkut:()=>`<div class="pf-top"><b>orkut</b><nav aria-hidden="true"><span>Início</span><span>Perfil</span><span>Scraps</span><span>Comunidades</span></nav></div>
     <div class="pf-g"><div class="pf-c"><div class="pf-card">${gato(p.avatar_gato,p.apelido)}<div class="pf-nome">${ap}</div><div class="pf-cap">Brasil · no Não Salvo desde ${esc(desde)}</div>
       <div class="lk" aria-hidden="true"><span>scraps (${nRec})</span><span>figurinhas (${a.tenho})</span><span>comunidades (${a.colecoes.length})</span></div></div></div>
      <div class="pf-c"><div class="pf-card pf-box"><h1 class="ola">${ap}</h1><div class="sorte"><b>Sorte do dia:</b> ${esc(sorte(p.apelido))}</div>
        <table><tr><td>patente:</td><td>${pat}</td></tr><tr><td>figurinhas:</td><td>${a.tenho} de ${a.total}</td></tr><tr><td>coleções completas:</td><td>${a.colecoes_completas}</td></tr><tr><td>no Não Salvo desde:</td><td>${esc(desde)}</td></tr></table></div>
       <div class="pf-card pf-box"><h2 class="pf-h">${esc(L.recados)} (${nRec})</h2>${rec}</div>
       <div class="pf-card"><h2 class="pf-h">Figurinhas (${a.tenho})</h2>${figs}</div></div>
      <div class="pf-c"><div class="pf-card pf-box"><h2 class="pf-h">Carta favorita</h2>${fav}</div><div class="pf-card"><h2 class="pf-h">Comunidades (coleções)</h2>${cols}</div></div></div>`,
    fotolog:()=>`<div class="pf-top"><b>${ap}</b><span>flog · no Não Salvo desde ${esc(desde)}</span></div>
     <div class="pf-g"><div class="pf-c"><div class="post">${fav}<h1 class="pf-h" style="border:0;text-transform:none;font-size:16px;color:#222;margin-top:14px">${P.carta_favorita?esc(P.carta_favorita.nome):"minha figurinha favorita"}</h1><p>postada por ${ap} · ${a.tenho} figurinhas no álbum</p>
       <div class="livro"><h2 class="pf-h">${esc(L.recados)} (${nRec})</h2>${rec}</div></div></div>
      <div class="pf-c"><div class="side pf-box">${gato(p.avatar_gato,p.apelido)}${pat}</div><div class="side pf-box"><h2 class="pf-h">flogs favoritos (figurinhas)</h2>${figs}</div><div class="side"><h2 class="pf-h">coleções</h2>${cols}</div></div></div>`,
    msn:()=>`<div class="win"><div class="tit"><span>Não Salvo Messenger · ${ap}</span><i aria-hidden="true"><span></span><span></span><span></span></i></div>
      <div class="eu">${gato(p.avatar_gato,p.apelido)}<div><h1 class="pf-nome" style="margin:0">~*~ ${ap} ~*~</h1><div class="pm">${P.carta_favorita?`♫ ouvindo: ${esc(P.carta_favorita.nome)}`:"(sem mensagem pessoal)"}</div><span class="st">Online</span></div></div>
      <div class="pf-g"><div class="pf-c"><div class="conversa"><h2 class="pf-h">${esc(L.recados)} (${nRec})</h2>${rec}</div></div>
       <div class="pf-c"><div class="lado pf-box"><h2 class="pf-h">Nível</h2>${pat}</div><div class="lado pf-box"><h2 class="pf-h">Carta favorita</h2>${fav}</div><div class="lado pf-box"><h2 class="pf-h">Contatos (coleções)</h2>${cols}</div><div class="lado"><h2 class="pf-h">Figurinhas (${a.tenho})</h2>${figs}</div></div></div></div>`,
    twitter:()=>`<div class="pf-g"><div class="pf-c main"><div class="cab">${gato(p.avatar_gato,p.apelido)}<div><h1 class="pf-nome" style="margin:0">${ap}</h1><div class="arroba">@${ap}</div><div class="bio">Colecionando figurinhas da internet brasileira desde ${esc(desde)}.</div></div></div>
       <h2 class="pf-h">${esc(L.recados)} (${nRec})</h2>${rec}</div>
      <div class="pf-c lado"><div class="nums"><span><b>${a.tenho}</b><span>figurinhas</span></span><span><b>${a.colecoes_completas}</b><span>coleções</span></span><span><b>${fmt(P.xp)}</b><span>XP</span></span></div>
       <div class="pf-box">${pat}</div><div class="pf-box"><h2 class="pf-h">Carta favorita</h2>${fav}</div><div class="pf-box"><h2 class="pf-h">Coleções</h2>${cols}</div><h2 class="pf-h">Figurinhas</h2>${figs}</div></div>`,
    facebook:()=>`<div class="pf-top"><b>facebook</b><span aria-hidden="true">Pesquisar</span></div>
     <div class="pf-g"><div class="pf-c">${gato(p.avatar_gato,p.apelido)}<div class="info"><span><b>Patente:</b> ${P.patente?esc(P.patente.nome):"-"}</span><span><b>Membro desde:</b> ${esc(desde)}</span><span><b>Figurinhas:</b> ${a.tenho} de ${a.total}</span></div></div>
      <div class="pf-c"><h1 class="pf-nome">${ap}</h1><div class="abas" aria-hidden="true"><span class="on">Mural</span><span>Informações</span><span>Fotos</span></div>
       <div class="caixa"><h2 class="pf-h">${esc(L.recados)} (${nRec})</h2>${rec}</div><div class="caixa"><h2 class="pf-h">Fotos (figurinhas)</h2>${figs}</div></div>
      <div class="pf-c"><div class="caixa"><h2 class="pf-h">Nível</h2>${pat}</div><div class="caixa"><h2 class="pf-h">Curtiu (carta favorita)</h2>${fav}</div><div class="caixa"><h2 class="pf-h">Grupos (coleções)</h2>${cols}</div></div></div>`
  };
  const el=$("pf");el.className="pf pf-"+(LAYOUTS[p.layout]?p.layout:"orkut");el.innerHTML=(T[p.layout]||T.orkut)();
  ligar(L);
}
// "sorte do dia" do Orkut: muda por dia e por pessoa, sem servidor
const SORTES=["Hoje é um bom dia para abrir um pacote.","Uma figurinha rara está mais perto do que parece.","Alguém vai deixar um scrap pra você.","Evite discutir com quem diz que o vestido é branco e dourado.","Hoje vale a pena visitar a linha do tempo.","Sua próxima carta pode ser Mítica. Ou não."];
function sorte(ap){let h=new Date().toDateString().length;for(const c of String(ap))h=(h*31+c.charCodeAt(0))>>>0;return SORTES[h%SORTES.length]}

function ligar(L){
  const el=$("pf");
  const b=el.querySelector("[data-todas]");if(b)b.onclick=()=>{MOSTRAR_TODAS=true;montar();avisar("Mostrando todas as figurinhas")};
  el.querySelectorAll("[data-apagar]").forEach(x=>x.onclick=()=>apagar(x.dataset.apagar));
  const f=$("rcF");if(!f)return;
  const t=$("rcT"),n=$("rcN");
  t.oninput=()=>{const r=MAX-[...t.value].length;n.textContent=`${r} caracteres restantes`};
  f.onsubmit=async ev=>{ev.preventDefault();const texto=t.value.trim();if(!texto){t.focus();toast("Escreva alguma coisa.");return}
    const bt=$("rcB");bt.disabled=true;
    try{const r=await Api.recadar(P.perfil.apelido,texto);REC.unshift(r);P.recados++;toast(L.ok);montar();avisar(L.ok);const nt=$("rcT");nt&&nt.focus()}
    catch(e){bt.disabled=false;if(e&&e.status&&e.status!==429)toast(e.erro||"Não consegui enviar agora.")}};
}
async function apagar(id){
  if(!confirmar())return;
  try{await Api.apagarRecado(id);REC=REC.filter(r=>String(r.id)!==String(id));montar();toast("Recado apagado.");avisar("Recado apagado")}
  catch(e){toast((e&&e.erro)||"Não consegui apagar agora.")}
}
// confirmação sem diálogo do navegador (que trava a página): 2 cliques em 4 s
let confirmT=0;function confirmar(){const a=Date.now();if(a-confirmT<4000){confirmT=0;return true}confirmT=a;toast("Clique de novo em “apagar” para confirmar.",3500);return false}

// ---- barra do dono (editar) ----
function barra(){
  const b=$("barra");
  if(!P||!P.perfil.eh_meu){b.innerHTML=P?`<div class="pf-barra"><p>Você está visitando o perfil de <b>${esc(P.perfil.apelido)}</b>.</p><div class="acoes"><a class="pf-bt" href="perfil.html">${icon("user")}Ver o meu perfil</a></div></div>`:"";return}
  b.innerHTML=`<div class="pf-barra"><p>Este é o seu perfil. É assim que os visitantes veem.</p><div class="acoes"><button type="button" class="pf-bt" id="btCopiar">${icon("link")}Copiar link</button><button type="button" class="pf-bt pri" id="btEditar">${icon("edit")}Editar perfil</button></div></div>`;
  $("btEditar").onclick=abrirEdicao;
  $("btCopiar").onclick=async()=>{const u=location.origin+"/"+linkPerfil(P.perfil.apelido);try{await navigator.clipboard.writeText(u);toast("Link do perfil copiado!")}catch(e){toast(u,5000)}};
}
function abrirEdicao(){
  const p=P.perfil;
  $("lays").innerHTML=Object.entries(LAYOUTS).map(([k,v])=>`<label class="pf-lay"><input type="radio" name="lay" value="${k}" ${k===p.layout?"checked":""}><i style="background:${v.cor}"></i>${esc(v.nome)}<small>${esc(v.dica)}</small></label>`).join("");
  const l=P.album.cartas.slice().sort((a,b)=>RORD.indexOf(a.raridade)-RORD.indexOf(b.raridade)||a.nome.localeCompare(b.nome));
  $("fav").innerHTML=`<option value="">Nenhuma</option>`+l.map(c=>`<option value="${esc(c.id)}" ${P.carta_favorita&&P.carta_favorita.id===c.id?"selected":""}>${esc(c.nome)} (${esc(c.raridade)})</option>`).join("");
  $("fav").disabled=!l.length;if(!l.length)$("fav").innerHTML=`<option value="">Você ainda não tem figurinhas</option>`;
  $("dlgErro").textContent="";$("dlg").showModal();
}
$("btCancelar").onclick=()=>$("dlg").close();
$("btGato").onclick=()=>{$("dlg").close();if(typeof openSignup==="function")openSignup()};
$("dlgF").onsubmit=async ev=>{ev.preventDefault();
  const lay=($("dlgF").querySelector("input[name=lay]:checked")||{}).value||P.perfil.layout,fav=$("fav").value||null;
  const corpo={perfil_layout:lay,carta_favorita:fav},bt=$("btSalvar");bt.disabled=true;$("dlgErro").textContent="";
  try{await Api.perfil(corpo);$("dlg").close();toast("Perfil salvo!");await carregar(P.perfil.apelido);avisar("Perfil salvo")}
  catch(e){$("dlgErro").textContent=(e&&e.erro)||"Não consegui salvar agora. Tente de novo."}
  finally{bt.disabled=false}};

// ---- carregar ----
function estado(titulo,texto,botao){$("pf").className="";$("pf").innerHTML=`<div class="pf-st"><b>${esc(titulo)}</b>${esc(texto)}${botao||""}</div>`}
async function carregar(ap){
  try{
    const [p,r]=await Promise.all([Api.perfilDe(ap,{silencioso:true}),Api.recados(ap,{silencioso:true})]);
    P=p;REC=(r&&r.itens)||[];
    document.title=`${P.perfil.apelido} · Perfil · NÃO SALVO`;
    barra();montar();
  }catch(e){
    if(e&&e.status===404)return estado("Perfil não encontrado","Confira o nome de quem você quer visitar.",`<br><a class="pf-bt" href="index.html">Voltar ao início</a>`);
    if(e&&e.status===401)return estado("Entre para ver os perfis","Os perfis são só para quem entrou com o Discord.",`<br><a class="pf-bt pri" href="/entrar.html?voltar=${encodeURIComponent(location.pathname+location.search)}">Entrar com Discord</a>`);
    estado("Não consegui carregar o perfil","Pode ser a conexão. Tente de novo em instantes.",`<br><button type="button" class="pf-bt" id="tentar">Tentar de novo</button>`);
    const t=$("tentar");if(t)t.onclick=()=>carregar(ap);
  }
}
(async()=>{
  if(pedido){if(!/^[A-Za-z0-9_.\-]{3,20}$/.test(pedido))return estado("Perfil não encontrado","Esse nome não existe por aqui.","");return carregar(pedido)}
  // sem ?u= : o próprio perfil
  try{const eu=await Api.eu({silencioso:true});if(eu&&eu.usuario){history.replaceState(null,"","perfil.html?u="+encodeURIComponent(eu.usuario.apelido)+location.hash);await carregar(eu.usuario.apelido);if(location.hash==="#editar"&&P&&P.perfil.eh_meu)abrirEdicao()}}
  catch(e){estado("Entre para ver o seu perfil","Os perfis são só para quem entrou com o Discord.",`<br><a class="pf-bt pri" href="/entrar.html?voltar=%2Fperfil.html">Entrar com Discord</a>`)}
})();
</script>
