name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Sintaxe JS (site + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/check-syntax.sh

  images:
    name: Imagens do data.js existem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/check-images.mjs

  asset-versions:
    name: Versão ?v= dos assets (aviso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/check-asset-versions.mjs

  api-tests:
    name: Testes da api (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/run-api-tests.sh

  migrations:
    name: Migrações sobem do zero (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14   # mesma versão do servidor 2
        env:
          POSTGRES_USER: naosalvo
          POSTGRES_PASSWORD: ci-descartavel
          POSTGRES_DB: naosalvo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naosalvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: naosalvo
      DB_PASSWORD: ci-descartavel
      DB_NAME: naosalvo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/check-migrations.sh
